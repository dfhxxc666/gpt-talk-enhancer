<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT TalkEnhancer runtime fixture</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #f6f7f9; color: #202124; }
    #fixture-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    #fixture-toolbar button { padding: 6px 10px; border: 1px solid #c6c9ce; border-radius: 7px; background: #fff; cursor: pointer; }
    [data-thread-find-target="conversation"] { max-width: 820px; margin: 0 auto; }
    [data-app-action-timeline-scroll] { position: relative; display: flex; flex-direction: column-reverse; height: 520px; overflow: auto; border: 1px solid #c6c9ce; border-radius: 10px; background: #fff; }
    [data-fixture-layer] { position: relative; flex: 0 0 12000px; height: 12000px; min-height: 12000px; }
    [data-content-search-turn-key] { position: absolute; left: 12px; right: 12px; min-height: 78px; padding: 12px; border-bottom: 1px solid #eceef1; }
    [data-user-message-bubble="true"] { display: inline-block; max-width: 82%; padding: 8px 10px; border-radius: 8px; background: #e9f1ff; }
    [data-fixture-assistant] { display: block; margin-top: 5px; color: #71757b; font-size: 12px; }
    [data-codex-composer-root] { max-width: 820px; margin: 14px auto 0; padding: 10px; border: 1px solid #c6c9ce; border-radius: 10px; background: #fff; }
    [data-thread-find-composer="true"] [contenteditable="true"] { min-height: 48px; padding: 8px; border: 1px solid #d9dce1; border-radius: 8px; outline: none; }
    [data-composer-footer-responsive] { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }
    #fixture-status { display: block; max-width: 820px; margin: 10px auto; color: #5f6368; font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="fixture-toolbar">
    <button type="button" data-fixture-switch="a">Conversation A</button>
    <button type="button" data-fixture-switch="b">Conversation B</button>
    <button type="button" data-fixture-add-user="true">Add User Turn</button>
    <button type="button" data-fixture-stream="true">Toggle Streaming</button>
  </div>
  <div id="fixture-host"></div>
  <output id="fixture-status" aria-live="polite"></output>
  <form data-codex-composer-root="true" data-composer-placement="thread">
    <div data-thread-find-composer="true" contenteditable="true" role="textbox" data-composer-markdown aria-label="给 ChatGPT 发消息"></div>
    <div data-composer-footer-responsive>
      <button type="button" data-composer-navigation-target="add-context">Add context</button>
    </div>
  </form>
  <script>
    (() => {
      const ROW_HEIGHT = 100;
      const conversations = {
        a: { count: 120, label: "Conversation A" },
        b: { count: 28, label: "Conversation B" }
      };
      const host = document.querySelector("#fixture-host");
      const status = document.querySelector("#fixture-status");
      const omitTotalMetadata = new URLSearchParams(location.search).has("no-total-metadata");
      let currentId = "a";
      let streaming = true;
      let streamTimer = null;

      function makeConversation(id) {
        const definition = conversations[id];
        const root = document.createElement("main");
        root.setAttribute("data-thread-find-target", "conversation");
        root.setAttribute("data-thread-id", id);
        root.dataset.fixtureConversation = id;

        const scroll = document.createElement("section");
        scroll.setAttribute("data-app-action-timeline-scroll", "true");
        const layer = document.createElement("div");
        layer.setAttribute("data-fixture-layer", "true");
        layer.style.height = `${definition.count * ROW_HEIGHT}px`;
        layer.style.minHeight = `${definition.count * ROW_HEIGHT}px`;
        layer.style.flexBasis = `${definition.count * ROW_HEIGHT}px`;
        scroll.appendChild(layer);
        root.appendChild(scroll);
        root.__fixture = { id, definition, scroll, layer, renderCount: 0, streamCount: 0 };
        scroll.addEventListener("scroll", () => renderWindow(root));
        renderWindow(root);
        return root;
      }

      function renderWindow(root) {
        const state = root.__fixture;
        const { scroll, layer, definition } = state;
        const maximum = Math.max(0, scroll.scrollHeight - scroll.clientHeight);
        const logical = Math.max(0, Math.min(maximum, maximum + scroll.scrollTop));
        const center = Math.floor(logical / ROW_HEIGHT);
        const start = Math.max(0, center - 4);
        const end = Math.min(definition.count, start + 12);
        layer.replaceChildren();
        for (let index = start; index < end; index += 1) {
          const turn = document.createElement("article");
          turn.setAttribute("data-content-search-turn-key", `${state.id}-turn-${index}`);
          turn.setAttribute("data-index", String(index));
          if (!omitTotalMetadata) {
            turn.setAttribute("aria-posinset", String(index + 1));
            turn.setAttribute("aria-setsize", String(definition.count));
          }
          turn.style.top = `${index * ROW_HEIGHT}px`;
          const user = document.createElement("div");
          user.setAttribute("data-user-message-bubble", "true");
          user.textContent = `${definition.label} user question ${index + 1}`;
          const assistant = document.createElement("span");
          assistant.setAttribute("data-fixture-assistant", "true");
          assistant.textContent = streaming ? `assistant stream ${state.renderCount}` : "assistant complete";
          turn.append(user, assistant);
          layer.appendChild(turn);
        }
        state.renderCount += 1;
        updateStatus(root, logical, maximum, start, end);
      }

      function updateStatus(root, logical, maximum, start, end) {
        const state = root.__fixture;
        status.value = `${state.id} rendered=${start}-${end - 1} scrollTop=${state.scroll.scrollTop.toFixed(1)} logical=${logical.toFixed(1)}/${maximum.toFixed(1)} renderCount=${state.renderCount}`;
      }

      function mount(id) {
        currentId = id;
        const root = makeConversation(id);
        host.replaceChildren(root);
        requestAnimationFrame(() => renderWindow(root));
        startStreaming();
      }

      function addUserTurn() {
        conversations[currentId].count += 1;
        mount(currentId);
      }

      function startStreaming() {
        if (streamTimer) clearInterval(streamTimer);
        streamTimer = setInterval(() => {
          const root = host.querySelector('[data-thread-find-target="conversation"]');
          if (streaming && root) {
            const state = root.__fixture;
            state.streamCount += 1;
            state.layer.querySelectorAll('[data-fixture-assistant]').forEach((assistant) => {
              assistant.textContent = `assistant stream ${state.streamCount}`;
            });
          }
        }, 40);
      }

      document.addEventListener("click", (event) => {
        const switchButton = event.target.closest("[data-fixture-switch]");
        if (switchButton) mount(switchButton.dataset.fixtureSwitch);
        if (event.target.closest("[data-fixture-add-user]")) addUserTurn();
        if (event.target.closest("[data-fixture-stream]")) streaming = !streaming;
      });

      window.__GPTTalkEnhancerFixture = {
        switchConversation: mount,
        addUserTurn,
        setStreaming(value) { streaming = Boolean(value); },
        getSnapshot() {
          const root = host.querySelector('[data-thread-find-target="conversation"]');
          const state = root?.__fixture;
          return state ? {
            id: state.id,
            count: state.definition.count,
            renderedKeys: [...state.layer.querySelectorAll("[data-content-search-turn-key]")].map((element) => element.getAttribute("data-content-search-turn-key")),
            scrollTop: state.scroll.scrollTop,
            scrollHeight: state.scroll.scrollHeight,
            clientHeight: state.scroll.clientHeight,
            renderCount: state.renderCount,
            streamCount: state.streamCount,
            omitTotalMetadata
          } : null;
        }
      };

      mount("a");
    })();
  </script>
</body>
</html>
